name: edutrack_app
description: "EduTrack — MVP navegável Flutter (Sprint 3) para o Instituto Eurofarma. Plataforma de engajamento e prevenção de evasão conectando aluno, educador e gestor."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/edutrack_mark.png
    - assets/fonts/
